[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tubetracks"
version = "1.6.0"
description = "TubeTracks: Enhanced YouTube to MP3 Downloader with multi-platform support"
readme = "README.md"
authors = [
    {name = "TubeTracks", email = "hayk.jomardyan@outlook.com"}
]
maintainers = [
    {name = "jomardyan"}
]
keywords = [
    "youtube",
    "mp3",
    "download",
    "audio",
    "yt-dlp",
    "tiktok",
    "instagram",
    "soundcloud",
    "spotify",
    "twitch",
    "media-downloader",
    "audio-converter",
    "tubetracks"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "yt-dlp[default]>=2026.10.21",
    "rich>=15.0.0,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.2,<0.18",
    "bandit>=1.9.4,<2",
    "build>=1.6.1,<2",
    "twine>=7.0.0,<8",
    "pip-audit>=2.10.1,<3",
]

[project.scripts]
tubetracks = "downloader:main"
ytdl = "downloader:main"
tubetracks-gui = "tubetracks_gui:main"
audiodownload = "downloader:main"

[project.urls]
Homepage = "https://github.com/jomardyan/TubeTracks"
Repository = "https://github.com/jomardyan/TubeTracks.git"
"Bug Tracker" = "https://github.com/jomardyan/TubeTracks/issues"
Documentation = "https://github.com/jomardyan/TubeTracks/blob/main/README.md"
Changelog = "https://github.com/jomardyan/TubeTracks/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["downloader", "tubetracks_gui"]
packages = ["plugins"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml"]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"plugins/__init__.py" = ["E402", "F401"]

[tool.coverage.run]
source = ["downloader", "tubetracks_gui", "plugins"]

[tool.coverage.report]
show_missing = true
