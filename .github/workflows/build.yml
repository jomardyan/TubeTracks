name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Check style and imports
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Audit dependencies
        run: python -m pip_audit --local --progress-spinner off
      - name: Check source for security issues
        run: python -m bandit -r downloader.py tubetracks_gui.py plugins -ll

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install FFmpeg and virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb python3-tk
      - name: Install full FFmpeg build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Verify required test dependencies
        run: |
          ffmpeg -version
          ffprobe -version
          python -c "import tkinter; print(tkinter.TkVersion)"
          python -m pip check
      - name: Verify required FFmpeg encoders
        shell: python
        run: |
          import subprocess

          output = subprocess.check_output(["ffmpeg", "-hide_banner", "-encoders"], text=True)
          available = {line.split()[1] for line in output.splitlines() if len(line.split()) >= 2}
          required = {"libmp3lame", "aac", "flac", "pcm_s16le", "libvorbis", "libopus", "mpeg4"}
          missing = required - available
          if missing:
              raise SystemExit("FFmpeg is missing required encoders: " + ", ".join(sorted(missing)))
          print("All required FFmpeg encoders are available")
      - name: Run full suite with a virtual display (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Run full suite (macOS and Windows)
        if: runner.os != 'Linux'
        run: python -m pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml

  package:
    name: Build and verify distributions
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Build and validate sdist and wheel
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Verify installed wheel outside the source checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-test/bin/python" -c "import downloader, tubetracks_gui; from plugins import get_global_registry; assert len(get_global_registry()) == 9"
          for command in tubetracks ytdl audiodownload tubetracks-gui; do
            "$RUNNER_TEMP/wheel-test/bin/$command" --help
            "$RUNNER_TEMP/wheel-test/bin/$command" --version
          done
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
